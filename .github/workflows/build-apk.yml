name: Build debug APK (fork)

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 改成 .nightly 后可以和官方版 grocy-android 共存，不用卸载。
      # 想直接覆盖官方版：把下面两行 sed 删掉即可（但需先卸载官方版，签名不同装不上）
      - name: Use separate applicationId
        run: |
          sed -i 's/applicationId = "xyz.zedler.patrick.grocy"/applicationId = "xyz.zedler.patrick.grocy.nightly"/' app/build.gradle
          sed -i 's|<string name="app_name" translatable="false">Grocy</string>|<string name="app_name" translatable="false">Grocy CN</string>|g' app/src/main/res/values/strings.xml

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: grocy-cn-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
